<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="images/contact-us.png" />

    <title>ContactHub | Smart Contact Home</title>
  </head>
  <body class="body-color">
    <div class="container-fluid bg-white shadow-sm py-2 fixed-top">
      <div class="container">
        <nav class="navbar navbar-expand-lg bg-white">
          <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-3" href="#">
              <div
                class="rounded-4 logo-color d-flex justify-content-center align-items-center"
                style="
                  width: 45px;
                  height: 45px;
                  background: linear-gradient(to top left, #6a30fa, #9369ff);
                "
              >
                <i class="fa-solid fa-address-book text-white fs-5"></i>
              </div>

              <div class="d-flex flex-column lh-sm">
                <h4 class="m-0 p-0 fw-bold">
                  Contact<span class="logo-color">Hub</span>
                </h4>
                <span
                  class="text-muted pt-1 fw-semibold"
                  style="font-size: 12px"
                  >Smart Contact Manager</span
                >
              </div>
            </a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavDropdown"
              aria-controls="navbarNavDropdown"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
              <ul class="navbar-nav ms-auto align-items-lg-center">
                <li
                  class="nav-item d-flex align-items-center mb-3 mt-lg-0 mt-3 mb-lg-0"
                >
                  <a
                    class="nav-link make-hover d-flex align-items-center"
                    href="#"
                  >
                    <button
                      class="py-2 px-3 border rounded-4 bg-logo-color text-white fw-semibold btn-hover"
                      data-bs-toggle="modal"
                      data-bs-target="#addContactModal"
                    >
                      + Add Contact
                    </button>
                  </a>
                </li>
                <li class="nav-item d-flex align-items-center mb-3 mb-lg-0">
                  <a
                    class="nav-link make-hover d-flex align-items-center"
                    href="#"
                  >
                    <div class="notif-box">
                      <i class="fa-solid fa-bell fs-6 text-secondary"></i>
                    </div>
                  </a>
                </li>
                <li class="nav-item d-flex align-items-center mb-3 mb-lg-0">
                  <a
                    class="nav-link d-flex make-hover align-items-center"
                    href="#"
                  >
                    <div class="notif-box">
                      <i class="fa-solid fa-gear fs-6 text-secondary"></i>
                    </div>
                  </a>
                </li>
                <li class="nav-item d-flex align-items-center">
                  <a class="nav-link d-flex align-items-center" href="#">
                    <img
                      src="images/avatar-4.jpg"
                      alt=""
                      class="rounded-3"
                      style="width: 40px; height: 40px"
                    />
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </div>
    <div class="container mt-5 py-1">
      <div class="row gx-4 mt-5 py-5">
        <div class="item-card col-12 col-md-6 col-lg-4 mb-3">
          <div class="inner p-3 rounded-4 bg-white shadow-sm">
            <div class="d-flex align-items-center gap-3">
              <div class="icon-box users-box bg-primary rounded-4 shadow-sm">
                <i class="fa-solid fa-users text-white fs-6"></i>
              </div>

              <div class="stats-text-wrap">
                <span class="small text-color fw-semibold m-0 p-0 text-font"
                  >TOTAL</span
                >
                <span class="fw-bold fs-3 m-0 p-0" id="totalcount">0</span>
              </div>
            </div>
          </div>
        </div>
        <div class="item-card col-12 col-md-6 col-lg-4 mb-3">
          <div class="inner p-3 rounded-4 bg-white shadow-sm">
            <div class="d-flex align-items-center gap-3">
              <div class="icon-box users-box bg-warning rounded-4 shadow-sm">
                <i class="fa-solid fa-star text-white fs-6"></i>
              </div>

              <div class="stats-text-wrap">
                <span class="small text-color fw-semibold m-0 p-0 text-font"
                  >FAVOURITS</span
                >
                <span class="fw-bold fs-3 m-0 p-0" id="totalfav">0</span>
              </div>
            </div>
          </div>
        </div>
        <div class="item-card col-12 col-md-6 col-lg-4 mb-3">
          <div class="inner p-3 rounded-4 bg-white shadow-sm">
            <div class="d-flex align-items-center gap-3">
              <div class="icon-box users-box bg-danger rounded-4 shadow-sm">
                <i class="fa-solid fa-heart-pulse text-white fs-6"></i>
              </div>

              <div class="stats-text-wrap">
                <span class="small text-color fw-semibold m-0 p-0 text-font"
                  >EMERGENCY</span
                >
                <span class="fw-bold fs-3 m-0 p-0" id="totalemer">0</span>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-8 mt-5">
          <h2 class="text-font fw-bold fs-3 fs-md-1">All Contacts</h2>
          <span
            class="text-secondary text-font d-block mt-2"
            style="font-size: clamp(0.85rem, 2vw, 1rem)"
          >
            Manage and organize your 0 contacts
          </span>
          <div class="search-wrapper mt-3">
            <div class="input-group">
              <span class="input-group-text">
                <i class="fa-solid fa-magnifying-glass"></i>
              </span>
              <input
                type="text"
                class="form-control"
                placeholder="Search By Name , Phone...."
                id="textinput"
                oninput="SearchByNamePhone()"
              />
            </div>
          </div>
          <div id="row" class="empty-state"></div>
        </div>
        <div class="col-12 col-lg-4 mt-5">
          <div class="favorites-card">
            <div class="favorites-header bg-warning bg-opacity-10">
              <div class="favorites-icon">
                <i class="fa-solid fa-star"></i>
              </div>
              <div class="favorites-info">
                <h5 class="favorites-title">Favorites</h5>
                <p class="favorites-subtitle">
                  Quick access to starred contacts
                </p>
              </div>
            </div>
            <div class="favorites-body">
              <p class="favorites-empty">No favorites yet</p>
            </div>
          </div>
          <div class="favorites-card mt-4">
            <div class="favorites-header bg-danger bg-opacity-10">
              <div class="Emergency-icon">
                <i class="fa-solid fa-heart-pulse"></i>
              </div>
              <div class="favorites-info">
                <h5 class="favorites-title">Emergency</h5>
                <p class="favorites-subtitle">
                  Important contacts for urgent calls
                </p>
              </div>
            </div>
            <div class="favorites-body">
              <p class="favorites-empty">No emergency contacts</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="addContactModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title">Add New Contact</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="contactForm">
              <div class="profile-photo-container">
                <div class="profile-photo" id="profilePhotoPreview">
                  <i class="fas fa-user"></i>
                </div>

                <label for="photoInput" class="change-photo-btn">
                  <i class="fas fa-camera"></i> Change Photo
                </label>

                <input onchange="changePhoto()" type="file" id="photoInput" />
              </div>

              <div class="mb-3">
                <label class="form-label">
                  Full Name <span class="required">*</span>
                </label>
                <input
                  oninput="nameinputvalidation()"
                  type="text"
                  class="form-control"
                  id="fullName"
                  placeholder="Enter full name"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">
                  Phone Number <span class="required">*</span>
                </label>
                <input
                  oninput="phoneinputvalidation()"
                  type="tel"
                  class="form-control"
                  id="phoneNumber"
                  placeholder="e.g., 01012345678"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                  oninput="emailinputvalidation()"
                  type="email"
                  class="form-control"
                  id="emailAddress"
                  placeholder="name@example.com"
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Address</label>
                <input
                  type="text"
                  class="form-control"
                  id="address"
                  placeholder="Enter address"
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea
                  class="form-control"
                  id="notes"
                  placeholder="Add any notes..."
                ></textarea>
              </div>

              <div class="checkbox-group">
                <label class="custom-checkbox">
                  <input type="checkbox" id="emergCheck" />
                  <i class="fas fa-heart-pulse"></i>
                  <span>Emergency</span>
                </label>

                <label class="custom-checkbox">
                  <input type="checkbox" id="favCheck" />
                  <i class="fas fa-star"></i>
                  <span>Favorite</span>
                </label>
              </div>
            </form>
          </div>

          <div class="modal-footer border-0">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
              id="addContactModal"
            >
              Cancel
            </button>
            <button
              type="button"
              data-bs-dismiss="modal"
              class="btn btn-primary"
              onclick="savecontact()"
              id="addbtn"
            >
              Save Contact
            </button>
            <button
              type="button"
              data-bs-dismiss="modal"
              class="btn btn-primary d-none"
              onclick="Updateuser()"
              id="updbtn"
            >
              Update Contact
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/index.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
